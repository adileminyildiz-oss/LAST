<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Segoe UI, Roboto, system-ui, sans-serif">
  <defs>
    <g id="badge">
      <rect width="100" height="100" rx="24" fill="#191a1c"/>
      <path fill="#ffffff" d="M30 38 H42 V71 H30 Z"/>
      <path fill="#ffffff" d="M58 38 H70 V71 H58 Z"/>
      <path fill="#ffffff" d="M36 38 L48 38 L53 61 L47 61 Z"/>
      <path fill="#ffffff" d="M52 38 L64 38 L53 61 L47 61 Z"/>
      <path fill="#4a9fe8" transform="rotate(7 78 48)" d="M73 40 L83 40 L78 57 Z"/>
    </g>
    <g id="markdark">
      <path fill="#17181a" d="M30 38 H42 V71 H30 Z"/>
      <path fill="#17181a" d="M58 38 H70 V71 H58 Z"/>
      <path fill="#17181a" d="M36 38 L48 38 L53 61 L47 61 Z"/>
      <path fill="#17181a" d="M52 38 L64 38 L53 61 L47 61 Z"/>
      <path fill="#4a9fe8" transform="rotate(7 78 48)" d="M73 40 L83 40 L78 57 Z"/>
    </g>
  </defs>

  <rect width="760" height="300" fill="#f3f5f9"/>
  <text x="40" y="42" font-size="15" font-weight="700" fill="#0e1218">Aperçu — logo Mar'q appliqué (favicon + icône d'app)</text>
  <text x="40" y="62" font-size="12" fill="#5a6474">Badge « M » + fanion bleu · rendu vectoriel, net à toutes les tailles</text>

  <!-- Badge grand -->
  <use href="#badge" transform="translate(40,86) scale(1.3)"/>
  <text x="105" y="240" font-size="11" fill="#5a6474" text-anchor="middle">130 px · app</text>

  <!-- 64 -->
  <use href="#badge" transform="translate(210,120) scale(0.64)"/>
  <text x="242" y="200" font-size="11" fill="#5a6474" text-anchor="middle">64 px</text>

  <!-- 32 -->
  <use href="#badge" transform="translate(300,136) scale(0.32)"/>
  <text x="316" y="184" font-size="11" fill="#5a6474" text-anchor="middle">32 px</text>

  <!-- 16 (favicon) -->
  <use href="#badge" transform="translate(360,144) scale(0.16)"/>
  <text x="368" y="176" font-size="11" fill="#5a6474" text-anchor="middle">16 px</text>

  <!-- Onglet de navigateur (mock) -->
  <g transform="translate(430,120)">
    <rect x="0" y="0" width="290" height="40" rx="9" fill="#ffffff" stroke="#d7dee8"/>
    <use href="#badge" transform="translate(11,11) scale(0.18)"/>
    <text x="42" y="25" font-size="13" fill="#2a3240">Mar'q — Pilotez vos formalités</text>
    <text x="270" y="25" font-size="15" fill="#9aa3b0">×</text>
  </g>
  <text x="575" y="180" font-size="11" fill="#5a6474" text-anchor="middle">onglet du navigateur</text>

  <!-- Monogramme seul (sur clair) -->
  <use href="#markdark" transform="translate(650,86) scale(0.9)"/>
  <text x="695" y="192" font-size="11" fill="#5a6474" text-anchor="middle">monogramme seul</text>
</svg>
